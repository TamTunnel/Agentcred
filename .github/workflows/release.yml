name: Release to npm (trusted publishing)

# Publishes all workspace packages to npm via OIDC trusted publishing.
# No NPM_TOKEN secret needed — GitHub mints a short-lived OIDC token per run
# and npm exchanges it for a publish token.
#
# One-time setup per package (npmjs.com -> package -> Settings ->
# Trusted Publisher -> GitHub Actions):
#   Organization/user: TamTunnel
#   Repository:        agentcred
#   Workflow filename: release.yml
#   Environment:       (leave blank — this workflow declares no environment)
#   Tick "Allow npm publish".
#
# The package must already exist on npm before its trusted publisher can be
# configured, so each package needs one manual first publish (then OIDC
# takes over for every release after).
#
# To cut a release: bump versions in packages/*/package.json, push to main,
# then run this workflow from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm >= 11.5.1, the minimum for OIDC
          registry-url: 'https://registry.npmjs.org'
      # NOTE: no NODE_AUTH_TOKEN here — it must be completely absent so npm
      # falls back to the OIDC token exchange.

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish packages in dependency order
        run: |
          for p in si-wallet-core core merchant mcp cli; do
            npm publish --workspace "packages/$p" --provenance --access public
          done
